# Local sandbox only. Nothing in this project deploys anywhere.
# Host port 5433 (not 5432) so it does not collide with a Postgres already running on the dev machine.
services:
  postgres:
    image: postgres:17-alpine
    container_name: veripura-postgres
    environment:
      POSTGRES_USER: veripura
      POSTGRES_PASSWORD: veripura_local_only
      POSTGRES_DB: veripura
    ports:
      - "5433:5432"
    volumes:
      - veripura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veripura -d veripura"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  veripura_pgdata:
